    // =========================================================================
    // 2. UTILITY & FORMATTING HELPERS
    // =========================================================================
    function formatRupiah(num) {
      return 'Rp ' + Number(num || 0).toLocaleString('id-ID');
    }

    function formatShortRupiah(num) {
      if (num >= 1000000) {
        return 'Rp ' + (num / 1000000).toFixed(1).replace('.0', '') + 'M';
      }
      return formatRupiah(num);
    }

    function calcOrderTotal(order) {
      return order.items.reduce((sum, item) => sum + (item.qty * item.harga), 0);
    }

    function showSnackbar(message, icon = 'check_circle') {
      const sb = document.getElementById('snackbar');
      document.getElementById('snackbar-text').textContent = message;
      document.getElementById('snackbar-icon').textContent = icon;
      sb.classList.remove('hidden');
      sb.classList.add('flex');
      clearTimeout(window._sbTimer);
      window._sbTimer = setTimeout(hideSnackbar, 3800);
    }

    function hideSnackbar() {
      const sb = document.getElementById('snackbar');
      if (sb) {
        sb.classList.add('hidden');
        sb.classList.remove('flex');
      }
    }

    function openModal(htmlContent) {
      const modal = document.getElementById('modal-root');
      modal.innerHTML = htmlContent;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('modal-root');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      modal.innerHTML = '';
    }

    function closeAllPopovers() {
      state.waffleOpen = false;
      state.profilePopoverOpen = false;
      state.notifPopoverOpen = false;
    }

        { id: 'profile', label: 'Pengaturan & Akses', icon: 'settings' }
      ];
    }

                      <span>${item.label}</span>

          </div>
        </div>
      `;

      return `

    // =========================================================================
    function approveOrder(orderId) {
      const ord = state.orders.find(o => o.id === orderId);
      if (!ord) return;
      ord.status = 'Dikonfirmasi';
      // Lock stock
      ord.items.forEach(item => {
        const inv = state.inventory.find(x => x.id === item.idBarang);
        if (inv) inv.terkunci += item.qty;
      });
      // Auto generate invoice per Sequence Diagram
      const invId = 'INV-' + Math.floor(1000 + Math.random() * 9000);
      state.invoices.unshift({
        id: invId,
        orderId: ord.id,
        wo: ord.wo,
        clientId: 'CW-8892',
        tanggal: new Date().toISOString().slice(0, 10),
        jatuhTempo: ord.tglAcara,
        diskon: 0,
        total: calcOrderTotal(ord),
        statusBayar: 'Belum Lunas',
        metode: 'Bank Transfer BCA'
      });
      state.auditLogs.unshift({
        id: 'LOG-' + Date.now(),
        type: 'SYSTEM',
        title: `Pesanan #${ord.id} Disetujui & Stok Dikunci`,
        desc: `Kuota barang untuk ${ord.wo} dikunci & Invoice #${invId} otomatis diterbitkan.`,
        time: 'Baru saja',
        unread: true
      });
      render();
      showSnackbar(`Pesanan #${ord.id} disetujui, stok dikunci, & Invoice #${invId} dibuat!`);
    }

    function rejectOrder(orderId) {
      const ord = state.orders.find(o => o.id === orderId);
      if (!ord) return;
      ord.status = 'Ditolak';
      state.auditLogs.unshift({
        id: 'LOG-' + Date.now(),
        type: 'INFO',
        title: `Pesanan #${ord.id} Ditolak`,
        desc: `Permintaan sewa dari ${ord.wo} ditolak pada tahap review.`,
        time: 'Baru saja',
        unread: true
      });
      render();
      showSnackbar(`Pesanan #${ord.id} telah ditolak.`, 'cancel');
    }

    function advanceOrderState(orderId) {
      const flow = ['Menunggu_Review', 'Dikonfirmasi', 'Dijadwalkan', 'Dalam_Pengiriman', 'Dipasang', 'Dalam_Pembongkaran', 'Kembali', 'Selesai'];
      const ord = state.orders.find(o => o.id === orderId);
      if (!ord) return;
      const idx = flow.indexOf(ord.status);
      if (idx >= 0 && idx < flow.length - 1) {
        ord.status = flow[idx + 1];
        if (ord.status === 'Selesai') {
          ord.items.forEach(item => {
            const inv = state.inventory.find(x => x.id === item.idBarang);
            if (inv) inv.terkunci = Math.max(0, inv.terkunci - item.qty);
          });
        }
        render();
        showSnackbar(`Status #${ord.id} diperbarui menjadi "${ord.status.replace('_', ' ')}"`);
      }
    }

    function getStatusBadge(status) {
      const map = {
        'Menunggu_Review': 'bg-[#FEF7E0] text-[#B06000]',
        'Dikonfirmasi': 'bg-[#E8F0FE] text-[#0B57D0]',
        'Dijadwalkan': 'bg-[#F3E8FD] text-[#6750A4]',
        'Dalam_Pengiriman': 'bg-[#E0F2FE] text-[#0369A1]',
        'Dipasang': 'bg-[#E6F4EA] text-[#137333]',
        'Dalam_Pembongkaran': 'bg-[#FEF7E0] text-[#B06000]',
        'Kembali': 'bg-[#EDF2FA] text-[#444746]',
        'Selesai': 'bg-[#E6F4EA] text-[#137333]',
        'Ditolak': 'bg-[#FCE8E6] text-[#B3261E]'

      return `<span class="text-xs font-semibold px-3 py-1 rounded-full ${map[status] || 'bg-[#EDF2FA] text-[#444746]'}">${status.replace('_', ' ')}</span>`;
    }

    function openOrderTrackingModal(orderId) {
      const ord = state.orders.find(o => o.id === orderId);
      if (!ord) return;
      const steps = [
        { key: 'Menunggu_Review', label: 'Pesanan Diajukan oleh WO', time: ord.tglPesan + ', 09:15 WIB' },
        { key: 'Dikonfirmasi', label: 'Direview & Dikonfirmasi Manajer (Stok Dikunci)', time: ord.tglPesan + ', 14:30 WIB' },
        { key: 'Dijadwalkan', label: 'Invoice Diterbitkan & Dijadwalkan Masuk Truk', time: 'H-2 Sebelum Acara' },
        { key: 'Dalam_Pengiriman', label: 'Dalam Perjalanan ke Lokasi Venue (GPS Aktif)', time: 'Hari H, 07:00 WIB' },
        { key: 'Dipasang', label: 'Pemasangan Tenda & Dekorasi Selesai (Foto QC)', time: 'Hari H, 11:30 WIB' },
        { key: 'Selesai', label: 'Pembongkaran & Kembali ke Gudang (QC OK)', time: 'Pasca Acara' }
      ];
      const orderFlow = ['Menunggu_Review', 'Dikonfirmasi', 'Dijadwalkan', 'Dalam_Pengiriman', 'Dipasang', 'Dalam_Pembongkaran', 'Kembali', 'Selesai'];
      const currIdx = orderFlow.indexOf(ord.status);

      openModal(`
        <div class="bg-white rounded-[28px] max-w-lg w-full p-6 shadow-2xl border border-[#E0E3E7] max-h-[90vh] overflow-y-auto">
          <div class="flex items-center justify-between pb-4 border-b border-[#E0E3E7]">
            <div>
              <span class="text-xs font-bold text-[#0B57D0]">#${ord.id}</span>
              <h3 class="font-display font-semibold text-lg text-[#1F1F1F]">Logistik & Operasional Proyek</h3>
            </div>
            <button onclick="closeModal()" class="p-2 rounded-full hover:bg-[#EDF2FA]"><span class="material-symbols-rounded">close</span></button>
          </div>

          <div class="my-4 p-4 rounded-2xl bg-[#F8FAFD] border border-[#E0E3E7]">
            <p class="text-xs text-[#444746]">Nama Proyek</p>
            <p class="font-display font-semibold text-sm text-[#1F1F1F]">${ord.wo} — ${ord.acara}</p>
            <div class="grid grid-cols-2 gap-3 mt-3 text-xs">
              <div><span class="text-[#444746] block">Tanggal Event</span><strong>${ord.tglAcara}</strong></div>
              <div><span class="text-[#444746] block">Field Manager</span><strong>${ord.fieldManager}</strong></div>
            </div>
          </div>

          <div class="space-y-4 my-4 pl-2">
            ${steps.map((st, idx) => {
              const stIdx = orderFlow.indexOf(st.key);
              const done = currIdx >= stIdx && ord.status !== 'Ditolak';
              return `
                <div class="flex gap-3.5 items-start">
                  <div class="w-7 h-7 rounded-full flex items-center justify-center shrink-0 ${done ? 'bg-[#188038] text-white' : 'bg-[#EDF2FA] text-[#747775]'}">
                    <span class="material-symbols-rounded text-[16px]">${done ? 'check' : 'radio_button_unchecked'}</span>
                  </div>
                  <div>
                    <p class="text-xs font-semibold ${done ? 'text-[#1F1F1F]' : 'text-[#747775]'}">${st.label}</p>
                    <p class="text-[11px] text-[#444746]">${st.time}</p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="flex justify-end gap-2 pt-3 border-t border-[#E0E3E7]">
            <button onclick="closeModal(); setTab('fleet');" class="px-4 py-2 rounded-full bg-[#EDF2FA] text-[#0B57D0] text-xs font-semibold">Lihat Peta Armada</button>
            <button onclick="closeModal()" class="px-5 py-2 rounded-full bg-[#0B57D0] text-white text-xs font-semibold">Tutup</button>
          </div>
        </div>
      `);
    }

    // =========================================================================
    function renderInventoryView() {

      const categories = ['Semua', 'tenda', 'kursi', 'meja', 'kain', 'panggung', 'blower', 'ac'];

      const filtered = state.inventory.filter(item => {
        const matchW = state.warehouseFilter === 'Semua Gudang' || item.gudang === state.warehouseFilter;
        const matchC = state.categoryFilter === 'Semua' || item.kategori === state.categoryFilter;
        const matchQ = item.nama.toLowerCase().includes(q) || item.id.toLowerCase().includes(q) || item.gudang.toLowerCase().includes(q);

      const totalAset = filtered.reduce((s, i) => s + i.total, 0);

                <span class="material-symbols-rounded text-[18px]">add</span>
                Tambah Master Barang
              </button>
            </div>
          </div>

          <!-- Warehouse Filter Pills -->
          <div class="flex items-center gap-2 overflow-x-auto pb-1">
            ${warehouses.map(w => `
              <button onclick="state.warehouseFilter = '${w}'; render();" class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap border transition ${state.warehouseFilter === w ? 'bg-[#0B57D0] border-[#0B57D0] text-white' : 'bg-white border-[#E0E3E7] text-[#444746] hover:bg-[#EDF2FA]'}">
                ${w}
              </button>
            `).join('')}
          </div>

          <!-- Summary Metric Cards (From Manajer Screenshot) -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="m3-card p-5">
              <span class="text-xs font-semibold text-[#444746] uppercase tracking-wider">Total Aset Terfilter</span>
              <div class="flex items-baseline gap-2 mt-1">

                <span class="text-xs font-semibold text-[#137333] bg-[#E6F4EA] px-2 py-0.5 rounded-full">Unit Aktif</span>
              </div>
            </div>
            <div class="m3-card p-5 bg-[#041E49] text-white border-[#041E49]">
              <span class="text-xs font-semibold text-[#A8C7FA] uppercase tracking-wider">Status Metode Gudang</span>
              <div class="flex items-center gap-2.5 mt-2">
                <span class="material-symbols-rounded text-[#7FCFFF] text-[28px]">inventory</span>
                <div>
                  <p class="font-display text-xl font-bold">LIFO Aktif</p>
                  <p class="text-[11px] text-[#C2E7FF]">Last-In, First-Out Picking Terkunci</p>
                </div>
              </div>
            </div>
            <div class="m3-card p-5">

              <div class="flex items-center gap-5 mt-2">
                <div>
                  <span class="text-xs text-[#137333] font-semibold block">Bagus</span>
                  <span class="font-display text-2xl font-bold text-[#137333]">${totalBagus}</span>
                </div>
                <div class="h-8 w-px bg-[#E0E3E7]"></div>
                <div>
                  <span class="text-xs text-[#B3261E] font-semibold block">Rusak / Maintenance</span>
                  <span class="font-display text-2xl font-bold text-[#B3261E]">${totalRusak}</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Category Filter Chips (SDD ENUM Categories) -->
          <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
            <span class="text-xs text-[#444746] mr-1">Kategori:</span>
            ${categories.map(c => `
              <button onclick="state.categoryFilter = '${c}'; render();" class="px-3 py-1 rounded-full text-xs font-medium capitalize border transition ${state.categoryFilter === c ? 'bg-[#D3E3FD] border-[#0B57D0] text-[#041E49] font-semibold' : 'bg-white border-[#E0E3E7] text-[#444746] hover:bg-[#EDF2FA]'}">
                ${c}
              </button>
            `).join('')}
          </div>

          <!-- Inventory Cards Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${filtered.map(item => {
              const bebasSewa = Math.max(0, item.bagus - item.terkunci);
              return `
                <div class="m3-card m3-card-hover p-5 flex flex-col justify-between">
                  <div>
                    <div class="flex items-start justify-between gap-2">
                      <div>
                        <div class="flex items-center gap-2">
                          <span class="text-xs font-bold text-[#0B57D0]">#${item.id}</span>
                          <span class="text-[11px] font-medium px-2 py-0.5 rounded-md bg-[#EDF2FA] text-[#444746] capitalize">${item.kategori}</span>
                          <span class="text-[11px] font-semibold px-2 py-0.5 rounded-md bg-[#E0F2FE] text-[#0369A1]">${item.metode}</span>
                        </div>
                        <h3 class="font-display font-semibold text-base text-[#1F1F1F] mt-1">${item.nama}</h3>
                        <p class="text-xs text-[#444746] mt-0.5">${item.gudang} • Tarif: <strong>${formatRupiah(item.harga)}</strong>/${item.satuan}</p>
                      </div>
                      <button onclick="openStokOpnameModal('${item.id}')" class="p-2 rounded-full hover:bg-[#EDF2FA] text-[#444746]" title="Edit & Stok Opname">
                        <span class="material-symbols-rounded text-[20px]">edit</span>
                      </button>
                    </div>

                    <div class="grid grid-cols-4 gap-2 my-4 p-3 rounded-2xl bg-[#F8FAFD] border border-[#E0E3E7] text-center">
                      <div>
                        <span class="text-[10px] text-[#444746] block">Stok Total</span>
                        <span class="font-display font-bold text-sm text-[#1F1F1F]">${item.total}</span>
                      </div>
                      <div>
                        <span class="text-[10px] text-[#137333] block">Bagus</span>
                        <span class="font-display font-bold text-sm text-[#137333]">${item.bagus}</span>
                      </div>
                      <div>
                        <span class="text-[10px] text-[#0B57D0] block">Terkunci</span>
                        <span class="font-display font-bold text-sm text-[#0B57D0]">${item.terkunci}</span>
                      </div>
                      <div>
                        <span class="text-[10px] text-[#B3261E] block">Rusak</span>
                        <span class="font-display font-bold text-sm text-[#B3261E]">${item.rusak}</span>
                      </div>
                    </div>
                  </div>

                  <div class="flex items-center justify-between gap-2 pt-2 border-t border-[#E0E3E7]">
                    <span class="text-xs text-[#444746]">Siap Sewa Bebas: <strong class="${bebasSewa < 15 ? 'text-[#B3261E]' : 'text-[#137333]'}">${bebasSewa} Unit</strong></span>
                    <div class="flex items-center gap-2">
                      ${item.rusak > 0 ? `
                        <button onclick="repairItem('${item.id}')" class="px-3 py-1.5 rounded-full bg-[#E6F4EA] hover:bg-[#CEEAD6] text-[#137333] text-xs font-semibold">
                          Selesai Perbaikan
                        </button>
                      ` : ''}
                      <button onclick="openStokOpnameModal('${item.id}')" class="px-4 py-1.5 rounded-full bg-[#0B57D0] hover:bg-[#0842A0] text-white text-xs font-semibold">
                        Stok Opname
                      </button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function openStokOpnameModal(itemId) {
      const item = state.inventory.find(i => i.id === itemId);
      if (!item) return;
      openModal(`
        <div class="bg-white rounded-[28px] max-w-md w-full p-6 shadow-2xl border border-[#E0E3E7]">
          <div class="flex items-center justify-between pb-3 border-b border-[#E0E3E7]">
            <div>
              <span class="text-xs font-bold text-[#0B57D0]">#${item.id} • Audit Fisik Gudang</span>
              <h3 class="font-display font-semibold text-lg text-[#1F1F1F]">Stok Opname: ${item.nama}</h3>
            </div>
            <button onclick="closeModal()" class="p-2 rounded-full hover:bg-[#EDF2FA]"><span class="material-symbols-rounded">close</span></button>
          </div>
          <form onsubmit="submitStokOpname(event, '${item.id}')" class="space-y-4 mt-4">
            <div>
              <label class="block text-xs font-medium text-[#444746] mb-1">Lokasi Penyimpanan Gudang</label>
              <select id="opname-gudang" class="w-full h-11 px-3 rounded-xl border border-[#747775] text-sm">
                ${state.warehouses.map(w => `<option value="${w.name}" ${w.name === item.gudang ? 'selected' : ''}>${w.name}</option>`).join('')}
              </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-[#137333] mb-1">Jumlah Kondisi Bagus</label>
                <input id="opname-bagus" type="number" min="0" required value="${item.bagus}" class="w-full h-11 px-3 rounded-xl border border-[#747775] text-sm font-semibold" />
              </div>
              <div>
                <label class="block text-xs font-medium text-[#B3261E] mb-1">Jumlah Kondisi Rusak</label>
                <input id="opname-rusak" type="number" min="0" required value="${item.rusak}" class="w-full h-11 px-3 rounded-xl border border-[#747775] text-sm font-semibold" />
              </div>
            </div>
            <p class="text-[11px] text-[#444746] bg-[#F8FAFD] p-3 rounded-xl border border-[#E0E3E7]">
              Sesuai SDD Use Case 1: Sistem memvalidasi angka non-negatif dan memperbarui kuota batas sewa proyek secara real-time.
            </p>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-full text-xs font-semibold text-[#444746] hover:bg-[#EDF2FA]">Batal</button>
              <button type="submit" class="px-5 py-2 rounded-full bg-[#0B57D0] text-white text-xs font-semibold">Simpan Stok Opname</button>
            </div>
          </form>
        </div>
      `);
    }

    function submitStokOpname(e, itemId) {
      e.preventDefault();
      const item = state.inventory.find(i => i.id === itemId);
      const bagus = parseInt(document.getElementById('opname-bagus').value, 10);
      const rusak = parseInt(document.getElementById('opname-rusak').value, 10);
      const gudang = document.getElementById('opname-gudang').value;
      if (isNaN(bagus) || isNaN(rusak) || bagus < 0 || rusak < 0) {
        showSnackbar('Format data kuantitas salah (harus angka positif).', 'error');
        return;
      }
      item.bagus = bagus;
      item.rusak = rusak;
      item.total = bagus + rusak;
      item.gudang = gudang;
      closeModal();
      render();
      showSnackbar('Data Stok Berhasil Diperbarui!');
    }

    function repairItem(itemId) {
      const item = state.inventory.find(i => i.id === itemId);
      if (!item || item.rusak <= 0) return;
      item.bagus += item.rusak;
      item.rusak = 0;
      render();
      showSnackbar(`Perbaikan ${item.nama} selesai (QC OK). Semua unit kembali siap sewa.`);
    }

    function openAddInventoryModal() {
      openModal(`
        <div class="bg-white rounded-[28px] max-w-md w-full p-6 shadow-2xl border border-[#E0E3E7]">
          <div class="flex items-center justify-between pb-3 border-b border-[#E0E3E7]">

            </div>
          </form>
        </div>
      `);

    function submitNewInventory(e) {
      e.preventDefault();
      const nama = document.getElementById('new-item-nama').value.trim();
      const kategori = document.getElementById('new-item-kat').value;
      const gudang = document.getElementById('new-item-gdg').value;

    function exportInventoryCSV() {
      const headers = ['ID_Barang', 'Nama_Barang', 'Kategori', 'Gudang', 'Stok_Total', 'Kondisi_Bagus', 'Terkunci', 'Rusak', 'Harga_Sewa'];
      const rows = state.inventory.map(i => [i.id, `"${i.nama}"`, i.kategori, `"${i.gudang}"`, i.total, i.bagus, i.terkunci, i.rusak, i.harga].join(','));
      const csv = [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Laporan_Inventaris_CV_Darul_2026.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showSnackbar('Laporan Inventaris (CSV/Excel) berhasil diunduh!');
    }

    function submitCashExpense(e) {
      e.preventDefault();
      const ket = document.getElementById('kas-ket').value.trim();
      const nom = parseInt(document.getElementById('kas-nom').value, 10);
      state.operationalCash.used += nom;
      state.operationalCash.expenses.unshift({ id: 'KAS-' + Date.now(), ket, nominal: nom, tgl: 'Baru saja' });
      closeModal();
      render();
      showSnackbar('Pengeluaran kas operasional berhasil dicatat!');
    }

    function submitDamageReport(e) {
      e.preventDefault();
      const itemId = document.getElementById('dmg-item').value;
      const qty = parseInt(document.getElementById('dmg-qty').value, 10);
      const cond = document.getElementById('dmg-cond').value;
      const desc = document.getElementById('dmg-desc').value.trim();

      const item = state.inventory.find(i => i.id === itemId);
      if (item && qty > 0) {
        const moved = Math.min(item.bagus, qty);
        item.bagus -= moved;
        item.rusak += moved;
      }

      state.auditLogs.unshift({
        id: 'LOG-' + Date.now(),
        type: 'URGENT',
        title: `LAPORAN KERUSAKAN: ${item ? item.nama : itemId} (${qty} Unit)`,
        desc: `Kru ${ROLES[state.currentRole].name} melaporkan [${cond}]: ${desc}`,
        time: 'Baru saja',
        unread: true
      });

      setTab('dashboard');
      showSnackbar('Laporan kerusakan berhasil dikirim ke Manajer & stok diperbarui!', 'warning');
    }

    function submitClientWizardOrder() {
      const wd = state.clientWizardData;
      const items = Object.entries(wd.cart)
        .filter(([_, qty]) => qty > 0)
        .map(([id, qty]) => {
          const it = state.inventory.find(i => i.id === id);
          return { idBarang: id, nama: it.nama, qty, harga: it.harga };
        });
      if (!items.length) {
        showSnackbar('Pilih minimal 1 item perlengkapan terlebih dahulu.', 'error');
        return;
      }
      const newOrdId = 'ORD-' + Math.floor(100 + Math.random() * 899);
      state.orders.unshift({
        id: newOrdId,
        wo: 'Citra Wedding Organizer',
        acara: 'Pesanan Proyek WO (' + wd.lokasiAcara.split(',')[0] + ')',
        tglPesan: new Date().toISOString().slice(0, 10),
        tglAcara: wd.tanggalAcara,
        lokasi: wd.lokasiAcara,
        status: 'Menunggu_Review',
        stokValid: true,
        fieldManager: 'Menunggu Penugasan',
        catatan: wd.catatan,
        items
      });
      state.auditLogs.unshift({
        id: 'LOG-' + Date.now(),
        type: 'SYSTEM',
        title: `Pesanan Baru Masuk #${newOrdId}`,
        desc: `Citra Wedding Organizer mengajukan sewa perlengkapan untuk tanggal ${wd.tanggalAcara}.`,
        time: 'Baru saja',
        unread: true
      });
      state.clientWizardStep = 1;
      setTab('orders');
      showSnackbar(`Pesanan #${newOrdId} berhasil dikirim! Menunggu validasi Admin/Manajer dalam 1×24 jam.`);
    }

                <div class="p-3.5 rounded-2xl bg-[#F8FAFD] border border-[#E0E3E7] flex items-center justify-between">
                  <div>
                    <p class="font-semibold text-[#1F1F1F]">Automated Daily Database Backup</p>
                    <p class="text-[#444746]">Terjadwal otomatis setiap pukul 23:59 WIB</p>
                  </div>
                  <span class="text-xs font-bold text-[#0B57D0]">Aktif</span>
                </div>
                <div class="p-3.5 rounded-2xl bg-[#F8FAFD] border border-[#E0E3E7] flex items-center justify-between">
                  <div>
                    <p class="font-semibold text-[#1F1F1F]">Notifikasi WhatsApp & Push FCM</p>
                    <p class="text-[#444746]">Broadcast otomatis jadwal kru & tagihan klien</p>
                  </div>
                  <input type="checkbox" checked onchange="showSnackbar('Preferensi notifikasi diperbarui')" class="w-4 h-4 accent-[#0B57D0]" />
                </div>
              </div>
            </div>

            <div class="m3-card p-6 space-y-3">
              <h2 class="font-display font-semibold text-base text-[#1F1F1F]">Pusat Bantuan & Dokumentasi ERP</h2>
              <div class="p-3.5 rounded-2xl bg-[#F8FAFD] border border-[#E0E3E7]">
                <p class="text-xs font-semibold text-[#1F1F1F]">Bagaimana metode LIFO bekerja di Gudang?</p>
                <p class="text-xs text-[#444746] mt-1">Barang yang terakhir masuk setelah proses QC bersih akan diprioritaskan keluar lebih dulu pada daftar LIFO Picking kru.</p>
              </div>
              <div class="p-3.5 rounded-2xl bg-[#F8FAFD] border border-[#E0E3E7]">
                <p class="text-xs font-semibold text-[#1F1F1F]">Mekanisme Anti Double-Booking</p>
                <p class="text-xs text-[#444746] mt-1">Saat Manajer menekan "Setujui & Kunci Stok", sistem langsung mengunci kuota item pada tanggal acara tersebut.</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 16. NEW WEDDING ORDER MODAL (BACK-OFFICE QUICK ACTION)
    // =========================================================================
    function openNewOrderModal() {
      openModal(`
        <div class="bg-white rounded-[28px] max-w-lg w-full p-6 shadow-2xl border border-[#E0E3E7]">
          <div class="flex items-center justify-between pb-3 border-b border-[#E0E3E7]">
            <h3 class="font-display font-semibold text-lg text-[#1F1F1F]">Input Pesanan Wedding Organizer Baru</h3>
            <button onclick="closeModal()" class="p-2 rounded-full hover:bg-[#EDF2FA]"><span class="material-symbols-rounded">close</span></button>
          </div>
          <form onsubmit="submitQuickOrder(event)" class="space-y-3.5 mt-4">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-[#444746] mb-1">Nama Klien / WO</label>
                <input id="qo-wo" type="text" required value="Citra Wedding Organizer" class="w-full h-11 px-3 rounded-xl border border-[#747775] text-sm" />
              </div>
              <div>
                <label class="block text-xs font-medium text-[#444746] mb-1">Tanggal Acara</label>
                <input id="qo-tgl" type="date" required value="2026-07-25" class="w-full h-11 px-3 rounded-xl border border-[#747775] text-sm" />
              </div>
            </div>
            <div>
              <label class="block text-xs font-medium text-[#444746] mb-1">Nama Proyek & Lokasi Venue</label>
              <input id="qo-acara" type="text" required placeholder="Misal: Resepsi Nabila & Fikri — Mason Pine Padalarang" class="w-full h-11 px-3 rounded-xl border border-[#747775] text-sm" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-[#444746] mb-1">Item Utama</label>
                <select id="qo-item" class="w-full h-11 px-3 rounded-xl border border-[#747775] text-sm">
                  ${state.inventory.map(i => `<option value="${i.id}">${i.nama}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-[#444746] mb-1">Kuantitas Sewa</label>
                <input id="qo-qty" type="number" min="1" required value="4" class="w-full h-11 px-3 rounded-xl border border-[#747775] text-sm" />
              </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-full text-xs font-semibold text-[#444746]">Batal</button>
              <button type="submit" class="px-5 py-2 rounded-full bg-[#0B57D0] text-white text-xs font-semibold">Simpan Pesanan</button>
            </div>
          </form>
        </div>
      `);
    }

    function submitQuickOrder(e) {
      e.preventDefault();
      const wo = document.getElementById('qo-wo').value;
      const tgl = document.getElementById('qo-tgl').value;
      const acara = document.getElementById('qo-acara').value;
      const itemId = document.getElementById('qo-item').value;
      const qty = parseInt(document.getElementById('qo-qty').value, 10);
      const inv = state.inventory.find(i => i.id === itemId);
      const newId = 'ORD-' + Math.floor(100 + Math.random() * 899);

      state.orders.unshift({
        id: newId,
        wo,
        acara,
        tglPesan: new Date().toISOString().slice(0, 10),
        tglAcara: tgl,
        lokasi: acara,
        status: 'Menunggu_Review',
        stokValid: true,
        fieldManager: 'Darul',
        catatan: 'Input langsung melalui Back-office Workspace.',
        items: [{ idBarang: inv.id, nama: inv.nama, qty, harga: inv.harga }]
      });
      closeModal();
      setTab('orders');
      showSnackbar(`Pesanan baru #${newId} berhasil dibuat!`);
    }

    // =========================================================================
    // 17. MASTER RENDER ROUTER
    // =========================================================================
    function getMainContentHTML() {
      const role = state.currentRole;
      const tab = state.activeTab;

      if (tab === 'profile') return renderProfileSettingsView();

      if (role === 'klien') {
        if (tab === 'wizard') return renderClientWizardView();
        if (tab === 'orders') return renderOrdersView();
        if (tab === 'invoices') return renderClientInvoicesView();
        return renderKlienDashboard();
      }

      if (role === 'kru') {
        if (tab === 'schedule') return renderScheduleView();
        if (tab === 'damage_report') return renderDamageReportView();
        if (tab === 'fleet') return renderFleetTrackingView();
        return renderKruDashboard();
      }

      // Manajer, Owner, Keuangan, Admin Gudang
      if (tab === 'orders') return renderOrdersView();
      if (tab === 'inventory') return renderInventoryView();
      if (tab === 'schedule') return renderScheduleView();
      if (tab === 'fleet') return renderFleetTrackingView();
      if (tab === 'finance') return renderFinanceView();
      if (tab === 'audit') return renderAuditLogView();
      return renderManagementDashboard();
    }

    function renderMainOnly() {
      const mainEl = document.getElementById('main-workspace');
      if (mainEl) {
        mainEl.innerHTML = getMainContentHTML();
      }
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (!state.isLoggedIn) {
        app.innerHTML = renderLoginScreen();
        return;
      }

      app.innerHTML = `
        ${renderTopAppBar()}
        <div class="flex-1 flex">
          ${renderNavigationDrawer()}
          <main id="main-workspace" onclick="if(state.waffleOpen || state.profilePopoverOpen || state.notifPopoverOpen){ closeAllPopovers(); render(); }"
            class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8 max-w-[1440px] mx-auto">
            ${getMainContentHTML()}
          </main>
        </div>
      `;
    }

    // Safe immediate & DOMContentLoaded initialization
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', render);
    } else {
      render();
    }
  </script>
</body>
</html>
